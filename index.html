<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="css.css" rel="stylesheet" type="text/css" >
    <script src=""></script>
</head>
<body>


<svg onload="Init()"> <!---->
    <title>Snake</title>


    <g transform="translate(50,50)"> <!-- -->

        <rect id="board" x="-4" y="-4" width="408" height="308" rx="2" ry="2" fill="#9999ff" stroke="none" stroke-width="3" ></rect>

        <circle id="Food" cx="-100" cy="-100" r="6" stroke="none" fill="#c00"></circle>

        <path id="Player" style="fill:none;
              stroke:#090;
              stroke-width:8px;
              stroke-linejoin:round;
              stroke-linecap:round;"
              d="M 10,10  L10,40" ></path>

        <g id="Head" transform="translate(10,40)"> //huvudet med sina ögon och pupiller
            <ellipse cx="0" cy="0" rx="7" ry="10" fill="#090"></ellipse>
            <ellipse cx="-3" cy="0" rx="3" ry="4" fill="#fff"></ellipse>
            <ellipse cx="3" cy="0" rx="3" ry="4" fill="#fff"></ellipse>
            <circle cx="-3" cy="2" r="2" fill="#000"></circle>
            <circle cx="3" cy="2" r="2" fill="#000"></circle>
        </g>

        <text id="ScoreBoard" x="0" y="350" font-family="sans-serif" font-size="40" font-weight="bold" fill="#000">Score: 0</text> //poängräknaren
        <text id="highscore" x="0" y="400" font-family="sans-serif" font-size="18" font-weight="bold" >Mitt highscore är 31, klå det ;) ;)</text>

        <g id="Splash" visibility="visible" font-family="sans-serif" font-weight="bold"> <!--splash-skärmen, pause/start/gameover-->
            <rect x="50" y="50" width="300" height="200" rx="5" ry="5" fill="#ffffff" fill-opacity="0.7" stroke="none" stroke-width="3"></rect>
            <text id="Text1" x="90" y="130" font-size="40" fill="#c3c"> </text>
            <text id="Text2" x="95" y="180" font-size="20" fill="#c3c"> </text>
        </g>

    </g>

    </svg>

<!--istället för att snake är lika långa hela tiden och bara blir längre när den äter en matbit,
    så blir han längre och längre konstant. rumpan raderas dock alltid ut innan den ritas i alla fall förutom när huvudet äter en matbit.
    istället för att bli längre vid matbit så är det snarare att han inte blir längre när han inte är vid matbit-->


</body>
</html>
